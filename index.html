    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="https://kit.fontawesome.com/7d003b5079.js" crossorigin="anonymous"></script>
    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const carouselInner = document.querySelector(".carousel-inner");
            const indicators = document.querySelector(".carousel-indicators");
            
            carouselInner.innerHTML = '<div class="carousel-item active"><div class="text-center p-5">ကားတွေကို ဖတ်နေသည်...</div></div>';
            indicators.innerHTML = '';

            fetch("cars.json")
                .then(res => {
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    return res.json();
                })
                .then(images => {
                    carouselInner.innerHTML = '';
                    
                    if (images.length === 0) {
                        carouselInner.innerHTML = '<div class="carousel-item active"><div class="text-center p-5">ကားတွေ မတွေ့ပါ</div></div>';
                        return;
                    }

                    images.forEach((src, index) => {
                        // Create indicator
                        const indicator = document.createElement("button");
                        indicator.type = "button";
                        indicator.dataset.bsTarget = "#carouselExampleAutoplaying";
                        indicator.dataset.bsSlideTo = index;
                        indicator.setAttribute("aria-label", `Slide ${index + 1}`);
                        if (index === 0) indicator.classList.add("active");
                        indicators.appendChild(indicator);

                        // Create carousel item with responsive image
                        const item = document.createElement("div");
                        item.className = "carousel-item" + (index === 0 ? " active" : "");
                        
                        const img = document.createElement("img");
                        img.src = src;
                        img.alt = `ကား ${index + 1}`;
                        
                        item.appendChild(img);
                        carouselInner.appendChild(item);
                    });
                })
                .catch(err => {
                    console.error("Error loading cars:", err);
                    carouselInner.innerHTML = '<div class="carousel-item active"><div class="text-center p-5 text-danger">ကားတွေကို မထည်နိုင်ပါ</div></div>';
                });
        });
    </script>
